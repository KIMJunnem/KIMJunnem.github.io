<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사이트 소개 | 혜택레이더</title><meta name="description" content="혜택레이더는 공식 정책 출처를 자동 확인해 신청 가치가 있는 지원정책을 구조화해 보여주는 서비스입니다."><link rel="canonical" href="https://kimjunnem.github.io/about.html"><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html">혜택레이더</a></div></header><main class="wrap page"><h1>사이트 소개</h1><p>혜택레이더는 정부·서울시 등 공식 출처에서 새로 공개되는 지원정책을 주기적으로 확인하고, 사람이 빠르게 판단할 수 있도록 지역·분야·대상·혜택·신청기간·공식 링크로 정리합니다.</p><h2>운영 원칙</h2><p>자동수집 결과는 원문을 그대로 복제하지 않고 핵심 정보를 구조화합니다. 자동 추출이 불확실한 정보는 검토 필요로 표시하며, 실제 신청 전에는 각 카드의 공식 출처를 확인해야 합니다.</p><h2>업데이트</h2><p>정책 데이터는 자동화된 일정에 따라 갱신되며, 출처의 장애나 구조 변경으로 일부 수집이 지연될 수 있습니다.</p></main><footer><div class="wrap"><a href="index.html">홈으로</a></div></footer></body></html>
