name: Update policies

on:
  schedule:
    - cron: '15 22 * * 0-4' # 평일 오전 7:15 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: policy-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Update policy data
        env:
          YOUTH_API_KEY: ${{ secrets.YOUTH_API_KEY }}
          PUBLIC_SERVICE_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: python scripts/update_policies.py

      - name: Generate real static pages
        run: python scripts/generate_static_pages.py

      - name: Validate generated site
        run: |
          test -f sitemap.xml
          test -f static-pages.css
          test -d policy
          test -d category
          test -d region
          test -f data/ai-index.json
          test -f data/answers.json
          echo "policy pages: $(find policy -type f -name '*.html' | wc -l)"
          echo "category pages: $(find category -type f -name '*.html' | wc -l)"
          echo "region pages: $(find region -type f -name '*.html' | wc -l)"

      - name: Commit site changes
        run: |
          git config user.name "benefit-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: update policies and static pages"
          git push
