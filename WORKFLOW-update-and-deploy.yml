name: Update policies

on:
  schedule:
    - cron: '15 22 * * 0-4' # 평일 오전 7:15 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: policy-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Watch official 2027 budget announcements
        run: python scripts/update_budget2027.py
      - name: Update policy data and AI discovery pages
        env:
          YOUTH_API_KEY: ${{ secrets.YOUTH_API_KEY }}
          PUBLIC_SERVICE_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: python scripts/update_policies.py
      - name: Commit generated site changes
        run: |
          git config user.name "benefit-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/policies.json data/ai-index.json data/answers.json data/budget2027.json data/budget2027-watch.json policy region category budget budget-2027.html sitemap.xml llms.txt robots.txt
          git diff --cached --quiet || git commit -m "chore: update policies and 2027 budget watch"
          git push
